<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Candidate Verification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #e0f2fe 100%);
            color: #1e293b;
        }

        .page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .panel {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(30, 41, 59, 0.12);
            overflow: hidden;
        }

        .panel-top {
            padding: 2rem 2rem 1.5rem;
            text-align: center;
            color: #fff;
            background: linear-gradient(135deg, #4f46e5, #0891b2);
        }

        .logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .panel-top h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .panel-top p {
            margin: 0.35rem 0 0;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .panel-body {
            padding: 1.75rem 2rem 2rem;
        }

        /* Candidate list */
        .candidates-box {
            background: #f8fafc;
            border: 1.5px dashed #cbd5e1;
            border-radius: 14px;
            padding: 1rem 1.1rem 0.9rem;
            margin-bottom: 1.5rem;
        }

        .candidates-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.7rem;
        }

        .candidates-head h2 {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #475569;
            margin: 0;
        }

        #candidate-count {
            font-size: 0.75rem;
            font-weight: 600;
            color: #4f46e5;
            background: #e0e7ff;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
        }

        #candidate-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        #candidate-list li {
            font-size: 0.82rem;
            padding: 0.3rem 0.75rem;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            color: #334155;
        }

        .hint {
            margin: 0.75rem 0 0;
            font-size: 0.75rem;
            color: #64748b;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #475569;
        }

        .form-control {
            padding: 0.7rem 0.95rem;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
        }

        .form-control:focus {
            background: #fff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn-check-name {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #4f46e5, #0891b2);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-check-name:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
            color: #fff;
        }

        #result {
            margin: 1.25rem 0 0;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
            text-align: center;
        }

        #result:empty {
            display: none;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="panel">
            <div class="panel-top">
                <div class="logo">ICT</div>
                <h1>Candidate Verification</h1>
                <p>Find out if you made it into the club</p>
            </div>

            <div class="panel-body">
                <div class="candidates-box">
                    <div class="candidates-head">
                        <h2>Candidates</h2>
                        <span id="candidate-count"></span>
                    </div>
                    <ul id="candidate-list"></ul>
                    <p class="hint">Not everyone on this list was selected. Type your name below to see the result.</p>
                </div>

                <div class="mb-3">
                    <label for="first-name" class="form-label">First Name</label>
                    <input type="text" id="first-name" class="form-control" placeholder="e.g. Cassey" autocomplete="off">
                </div>

                <div class="mb-3">
                    <label for="last-name" class="form-label">Last Name</label>
                    <input type="text" id="last-name" class="form-control" placeholder="e.g. Mallari" autocomplete="off">
                </div>

                <button type="button" class="btn btn-check-name" py-click="check_candidate">Check My Name</button>

                <div id="result" role="status" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <footer>ICT Club &middot; Seatwork 1 &middot; 2nd Quarter</footer>

    <script type="py" src="./main.py"></script>
</body>
</html>
